<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增設備</title>
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .header-nav { max-width: 500px; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; }
        .nav-group { display: flex; gap: 8px; }
        .nav-btn { text-decoration: none; padding: 8px 14px; background-color: #6c757d; color: white; border-radius: 5px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; }
        .btn-scan { background-color: #007bff; }
        
        .card-container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-container h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #17a2b8; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        .btn-submit:disabled { background-color: #a5d8e1; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h2 style="margin: 0;">➕ 新增設備</h2>
        <div class="nav-group">
            <a href="index.html" class="nav-btn btn-scan">📷 掃描頁面</a>
            <a href="list.html" class="nav-btn">📋 設備清單</a>
        </div>
    </div>

    <div class="card-container">
        <h3>設備資訊填寫</h3>
        <div class="form-group">
            <label for="add-id">設備編號 (ID) *</label>
            <input type="text" id="add-id" placeholder="例如：1005">
        </div>
        <div class="form-group">
            <label for="add-name">設備名稱 *</label>
            <input type="text" id="add-name" placeholder="例如：平板電腦">
        </div>
        <div class="form-group">
            <label for="add-brand">廠牌 / 型號</label>
            <input type="text" id="add-brand" placeholder="例如：APPLE">
        </div>
        <button id="btn-add" class="btn-submit" onclick="addEquipment()">確認新增設備</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxI58qgh5GuGcQtJL8y5DaYZ91DRqcuvm_Iv8QmRlvS3QcEe6HETD3nG01BBS6Fr4fM/exec"; 

        function addEquipment() {
            const idInput = document.getElementById('add-id');
            const nameInput = document.getElementById('add-name');
            const brandInput = document.getElementById('add-brand');
            const submitBtn = document.getElementById('btn-add');

            const id = idInput.value.trim();
            const name = nameInput.value.trim();
            const brand = brandInput.value.trim();

            if (!id || !name) {
                alert("請填寫【設備編號】與【設備名稱】！");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "資料處理中...";

            const url = `${API_URL}?action=add&id=${encodeURIComponent(id)}&name=${encodeURIComponent(name)}&brand=${encodeURIComponent(brand)}`;
            
            fetch(url, { redirect: "follow" })
                .then(response => response.text())
                .then(msg => {
                    alert(msg);
                    if (msg.includes("成功")) {
                        window.location.href = "list.html";
                    }
                })
                .catch(err => {
                    alert("新增設備時發生錯誤！");
                    console.error(err);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "確認新增設備";
                });
        }
    </script>
</body>
</html>
