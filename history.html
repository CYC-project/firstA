<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備借還歷史紀錄</title>
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .header-nav { max-width: 900px; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nav-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .nav-btn { text-decoration: none; padding: 8px 12px; background-color: #007bff; color: white; border-radius: 5px; font-weight: bold; font-size: 13px; border: none; cursor: pointer; }
        .btn-list { background-color: #17a2b8; }
        .btn-logout { background-color: #dc3545; }

        .card-container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow-x: auto; }
        .search-box { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #f1f3f5; white-space: nowrap; }
        .badge-unreturned { background-color: #ffeeba; color: #856404; padding: 3px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h2 style="margin: 0;">📜 設備借還歷史紀錄</h2>
        <div class="nav-group">
            <a href="list.html" class="nav-btn btn-list">📋 設備清單</a>
            <a href="index.html" class="nav-btn">📷 掃描頁面</a>
            <button class="nav-btn btn-logout" onclick="logout()">登出</button>
        </div>
    </div>

    <div style="max-width: 900px; margin: 0 auto;">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 搜尋設備編號、設備名稱、借用者帳號或姓名..." onkeyup="filterLogs()">
    </div>

    <div class="card-container">
        <table>
            <thead>
                <tr>
                    <th>設備編號</th>
                    <th>設備名稱</th>
                    <th>借用者帳號</th>
                    <th>借用者名稱</th>
                    <th>租借時間</th>
                    <th>歸還時間</th>
                </tr>
            </thead>
            <tbody id="log-list">
                <tr><td colspan="6" style="text-align:center;">紀錄載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxI58qgh5GuGcQtJL8y5DaYZ91DRqcuvm_Iv8QmRlvS3QcEe6HETD3nG01BBS6Fr4fM/exec";
        let allLogs = [];

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function fetchLogs() {
            fetch(`${API_URL}?action=logs`, { redirect: "follow" })
                .then(res => res.json())
                .then(data => {
                    allLogs = data;
                    renderLogs(data);
                })
                .catch(err => {
                    console.error("讀取紀錄失敗", err);
                    document.getElementById('log-list').innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">無法載入紀錄</td></tr>';
                });
        }

        function renderLogs(logs) {
            const tbody = document.getElementById('log-list');
            tbody.innerHTML = "";

            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">目前尚無借還紀錄</td></tr>';
                return;
            }

            logs.forEach(item => {
                const tr = document.createElement('tr');
                const returnDisplay = item.returnTime 
                    ? escapeHtml(item.returnTime) 
                    : '<span class="badge-unreturned">尚未歸還</span>';

                tr.innerHTML = `
                    <td>${escapeHtml(item.eqId)}</td>
                    <td>${escapeHtml(item.eqName)}</td>
                    <td>${escapeHtml(item.userId)}</td>
                    <td>${escapeHtml(item.userName)}</td>
                    <td>${escapeHtml(item.borrowTime)}</td>
                    <td>${returnDisplay}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterLogs() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const filtered = allLogs.filter(item =>
                item.eqId.toLowerCase().includes(q) ||
                item.eqName.toLowerCase().includes(q) ||
                item.userId.toLowerCase().includes(q) ||
                item.userName.toLowerCase().includes(q)
            );
            renderLogs(filtered);
        }

        fetchLogs();
    </script>
</body>
</html>
