<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備狀態分類清單</title>
    <script>
        if (sessionStorage.getItem("isLoggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f8f9fa; margin: 0; }
        .header-nav { max-width: 650px; margin: 0 auto 15px auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .nav-group { display: flex; gap: 8px; }
        .nav-btn { text-decoration: none; padding: 8px 14px; background-color: #007bff; color: white; border-radius: 5px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; }
        .btn-add { background-color: #17a2b8; }
        .btn-logout { background-color: #dc3545; }
        
        .card-container { max-width: 650px; margin: 0 auto 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card-container h3 { margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }

        .search-box { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; margin-bottom: 15px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 15px; }
        th { background-color: #f1f3f5; }
        
        .status-available { color: #28a745; font-weight: bold; }
        .status-borrowed { color: #dc3545; font-weight: bold; }
        .note-text { font-size: 13px; color: #555; }
        .count-badge { font-size: 14px; padding: 2px 8px; border-radius: 12px; font-weight: normal; background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body>

    <div class="header-nav">
        <h2 style="margin: 0;">📋 設備狀態清單</h2>
        <div class="nav-group">
            <a href="add.html" class="nav-btn btn-add">➕ 新增設備</a>
            <a href="index.html" class="nav-btn">📷 掃描頁面</a>
            <button class="nav-btn btn-logout" onclick="logout()">登出</button>
        </div>
    </div>

    <div style="max-width: 650px; margin: 0 auto;">
        <input type="text" id="search-input" class="search-box" placeholder="🔍 搜尋設備編號、名稱或借用人..." onkeyup="filterList()">
    </div>

    <!-- 1. 借出中設備區塊 -->
    <div class="card-container">
        <h3>
            <span>🔴 借出中清單</span>
            <span id="borrowed-count" class="count-badge">0 項</span>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>編號</th>
                    <th>設備名稱</th>
                    <th>借用人 / 時間</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="borrowed-list">
                <tr><td colspan="4" style="text-align:center;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 2. 可借用設備區塊 -->
    <div class="card-container">
        <h3>
            <span>🟢 可借用清單</span>
            <span id="available-count" class="count-badge">0 項</span>
        </h3>
        <table>
            <thead>
                <tr>
                    <th>編號</th>
                    <th>設備名稱</th>
                    <th>狀態</th>
                </tr>
            </thead>
            <tbody id="available-list">
                <tr><td colspan="3" style="text-align:center;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbydzCmBC4lt39wooP7syjnKSIWpL6u0yHshsNOj_4PVuHxKDlLdRABauw2YsYWM2iDS/exec"; 
        let equipmentData = [];

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function fetchEquipmentList() {
            fetch(`${API_URL}?action=list`, { redirect: "follow" })
                .then(response => response.json())
                .then(data => {
                    equipmentData = data;
                    renderLists(data);
                })
                .catch(err => {
                    console.error("無法取得清單", err);
                });
        }

        function renderLists(data) {
            const borrowedTbody = document.getElementById('borrowed-list');
            const availableTbody = document.getElementById('available-list');
            
            borrowedTbody.innerHTML = "";
            availableTbody.innerHTML = "";

            const borrowedItems = data.filter(item => item.status === "借出中");
            const availableItems = data.filter(item => item.status === "可借用");

            document.getElementById('borrowed-count').innerText = `${borrowedItems.length} 項`;
            document.getElementById('available-count').innerText = `${availableItems.length} 項`;

            if (borrowedItems.length === 0) {
                borrowedTbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#888;">目前沒有借出中的設備</td></tr>';
            } else {
                borrowedItems.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(item.id)}</td>
                        <td>${item.brand ? escapeHtml(item.brand) + ' ' : ''}${escapeHtml(item.name)}</td>
                        <td class="note-text">${escapeHtml(item.note || '-')}</td>
                        <td class="status-borrowed">${escapeHtml(item.status)}</td>
                    `;
                    borrowedTbody.appendChild(tr);
                });
            }

            if (availableItems.length === 0) {
                availableTbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#888;">目前沒有可借用的設備</td></tr>';
            } else {
                availableItems.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(item.id)}</td>
                        <td>${item.brand ? escapeHtml(item.brand) + ' ' : ''}${escapeHtml(item.name)}</td>
                        <td class="status-available">${escapeHtml(item.status)}</td>
                    `;
                    availableTbody.appendChild(tr);
                });
            }
        }

        function filterList() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = equipmentData.filter(item => 
                item.id.toLowerCase().includes(query) || 
                item.name.toLowerCase().includes(query) || 
                item.brand.toLowerCase().includes(query) ||
                (item.note && item.note.toLowerCase().includes(query))
            );
            renderLists(filtered);
        }

        fetchEquipmentList();
    </script>
</body>
</html>
